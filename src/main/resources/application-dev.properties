spring.application.name=manage_activities

# Server Configuration
server.port=${SERVER_PORT:8080}

# Development Database Configuration - H2 (default) or MySQL (via env vars)
# Uncomment below to use MySQL instead of H2
# spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=${DB_USERNAME:root}
# spring.datasource.password=${DB_PASSWORD:}

# H2 In-Memory Database Configuration (default for development)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration (Development - Localhost)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000ms


