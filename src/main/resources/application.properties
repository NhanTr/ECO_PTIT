spring.application.name=manage_activities

# Server Configuration
server.port=${SERVER_PORT:8080}

# Primary Database Configuration (EC2) - Using environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://ec2-100-53-113-198.compute-1.amazonaws.com:3306/ADB_PTIT}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fallback Database Configuration (Localhost) - Using environment variables
spring.datasource-fallback.url=${DB_FALLBACK_URL:jdbc:mysql://localhost:3306/ADB_PTIT}
spring.datasource-fallback.username=${DB_FALLBACK_USERNAME:root}
spring.datasource-fallback.password=${DB_FALLBACK_PASSWORD:root}
spring.datasource-fallback.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JWT Configuration
jwt.secret-key=${JWT_SECRET_KEY:MySecretKeyForJWTAuthenticationChangeThisInProduction123456}
jwt.valid-duration=${JWT_VALID_DURATION:3600}
jwt.refresh-duration=${JWT_REFRESH_DURATION:604800}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000ms

